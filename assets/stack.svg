<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-label="System map of Nikhil's stack drawn as a circuit board. Inputs Phone SIP, WhatsApp, Chat and Email flow into an Agent Runtime chip running LiveKit, WebRTC, SIP with STT and TTS, connected to an LLM Core chip with LangGraph, MCP, RAG and LoRA QLoRA, mounted on an infra bus of FastAPI, MongoDB, Redis, Postgres, Docker, Kubernetes, AWS, GCP Vertex, Langfuse and vector databases Pinecone and FAISS.">
  <defs>
    <pattern id="pcb-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle class="grid-dot" cx="12" cy="12" r="1.1"/>
    </pattern>
  </defs>
  <style>
    .win      { fill: #fbf9f4; stroke: #e2dcd0; }
    .bar      { fill: #f1ecdf; }
    .chipfill { fill: #f1ecdf; }
    .dot1     { fill: #b45309; } .dot2 { fill: #7c3aed; } .dot3 { fill: #0e7490; }
    .fg       { fill: #241f2e; }
    .amber    { fill: #b45309; }
    .violet   { fill: #7c3aed; }
    .muted    { fill: #6f6880; }
    .grid-dot { fill: #6f6880; opacity: 0.15; }
    .s-amber  { fill: none; stroke: #b45309; }
    .s-violet { fill: none; stroke: #7c3aed; }
    .s-cyan   { fill: none; stroke: #0e7490; }
    .trace    { fill: none; stroke: #6f6880; stroke-width: 1.5; stroke-dasharray: 3 4; opacity: 0.55; }
    .pin      { fill: #6f6880; opacity: 0.5; }
    .d-amber  { fill: #b45309; }
    .d-violet { fill: #7c3aed; }
    @media (prefers-color-scheme: dark) {
      .win      { fill: #0f0a1a; stroke: #2d2640; }
      .bar      { fill: #171126; }
      .chipfill { fill: #171126; }
      .dot1     { fill: #f0a63a; } .dot2 { fill: #a78bfa; } .dot3 { fill: #67e8f9; }
      .fg       { fill: #ece7f4; }
      .amber    { fill: #f0a63a; }
      .violet   { fill: #a78bfa; }
      .muted    { fill: #8d86a0; }
      .grid-dot { fill: #8d86a0; opacity: 0.12; }
      .s-amber  { stroke: #f0a63a; }
      .s-violet { stroke: #a78bfa; }
      .s-cyan   { stroke: #67e8f9; }
      .trace    { stroke: #8d86a0; }
      .pin      { fill: #8d86a0; }
      .d-amber  { fill: #f0a63a; }
      .d-violet { fill: #a78bfa; }
    }
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
    }
    .title    { font-size: 12.5px; }
    .chiptitle{ font-size: 15px; font-weight: 700; letter-spacing: 1px; }
    .sub      { font-size: 12px; }
    .tiny     { font-size: 11.5px; }
    .led      { animation: led 1.6s steps(1, end) infinite; }
    .led2     { animation: led 1.6s steps(1, end) 0.8s infinite; }
    @keyframes led { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0.2; } }
    @media (prefers-reduced-motion: reduce) {
      .led, .led2 { animation: none; }
      .pulse { display: none; }
    }
  </style>

  <!-- window -->
  <rect class="win" x="1" y="1" width="798" height="438" rx="10" stroke-width="1"/>
  <rect fill="url(#pcb-dots)" x="8" y="40" width="784" height="392"/>
  <path class="bar" d="M1 11 a10 10 0 0 1 10 -10 h778 a10 10 0 0 1 10 10 v25 h-798 z"/>
  <circle class="dot1" cx="24" cy="19" r="6"/>
  <circle class="dot2" cx="46" cy="19" r="6"/>
  <circle class="dot3" cx="68" cy="19" r="6"/>
  <text class="muted title" x="400" y="23" text-anchor="middle">nikhil@ai-agents: ~/stack — system map</text>

  <!-- traces -->
  <path class="trace" d="M172 110 C215 110 205 160 250 160"/>
  <path class="trace" d="M172 190 C210 190 210 205 250 205"/>
  <path class="trace" d="M172 270 C215 270 205 250 250 250"/>
  <path class="trace" d="M450 170 H545"/>
  <path class="trace" d="M545 240 H450"/>
  <path class="trace" d="M350 290 V330"/>
  <path class="trace" d="M652 290 V330"/>
  <line class="trace" x1="40" y1="350" x2="760" y2="350"/>

  <!-- signal pulses -->
  <g class="pulse">
    <circle class="d-amber" r="3"><animateMotion dur="2.4s" begin="0s"   repeatCount="indefinite" path="M172 110 C215 110 205 160 250 160"/></circle>
    <circle class="d-amber" r="3"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M172 190 C210 190 210 205 250 205"/></circle>
    <circle class="d-amber" r="3"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M172 270 C215 270 205 250 250 250"/></circle>
    <circle class="d-violet" r="3"><animateMotion dur="1.8s" begin="0.4s" repeatCount="indefinite" path="M450 170 H545"/></circle>
    <circle class="d-violet" r="3"><animateMotion dur="1.8s" begin="1.3s" repeatCount="indefinite" path="M545 240 H450"/></circle>
    <circle class="d-violet" r="3"><animateMotion dur="1.4s" begin="0.3s" repeatCount="indefinite" path="M350 290 V330"/></circle>
    <circle class="d-violet" r="3"><animateMotion dur="1.4s" begin="0.9s" repeatCount="indefinite" path="M652 290 V330"/></circle>
  </g>

  <!-- input jacks -->
  <rect class="s-amber chipfill" x="40" y="88"  width="132" height="44" rx="10" stroke-width="1.5"/>
  <text class="fg" x="106" y="115" text-anchor="middle">PHONE · SIP</text>
  <rect class="s-amber chipfill" x="40" y="168" width="132" height="44" rx="10" stroke-width="1.5"/>
  <text class="fg" x="106" y="195" text-anchor="middle">WHATSAPP</text>
  <rect class="s-amber chipfill" x="40" y="248" width="132" height="44" rx="10" stroke-width="1.5"/>
  <text class="fg" x="106" y="275" text-anchor="middle">CHAT · EMAIL</text>

  <!-- agent runtime chip -->
  <rect class="pin" x="290" y="112" width="3" height="8"/>
  <rect class="pin" x="320" y="112" width="3" height="8"/>
  <rect class="pin" x="350" y="112" width="3" height="8"/>
  <rect class="pin" x="380" y="112" width="3" height="8"/>
  <rect class="pin" x="410" y="112" width="3" height="8"/>
  <rect class="s-amber chipfill" x="250" y="120" width="200" height="170" rx="8" stroke-width="1.5"/>
  <circle class="d-amber led" cx="436" cy="136" r="4"/>
  <text class="chiptitle amber" x="350" y="152" text-anchor="middle">AGENT RUNTIME</text>
  <text class="sub muted" x="350" y="174" text-anchor="middle">LiveKit · WebRTC · SIP</text>
  <rect class="s-amber" x="272" y="192" width="74" height="34" rx="6" stroke-width="1" stroke-opacity="0.5"/>
  <text class="fg" x="309" y="213" text-anchor="middle">STT</text>
  <text class="amber" x="359" y="213" text-anchor="middle">⇄</text>
  <rect class="s-amber" x="372" y="192" width="72" height="34" rx="6" stroke-width="1" stroke-opacity="0.5"/>
  <text class="fg" x="408" y="213" text-anchor="middle">TTS</text>
  <text class="tiny muted" x="350" y="262" text-anchor="middle">Gemini Live · Sarvam</text>

  <!-- llm core chip -->
  <rect class="pin" x="585" y="112" width="3" height="8"/>
  <rect class="pin" x="615" y="112" width="3" height="8"/>
  <rect class="pin" x="645" y="112" width="3" height="8"/>
  <rect class="pin" x="675" y="112" width="3" height="8"/>
  <rect class="pin" x="705" y="112" width="3" height="8"/>
  <rect class="s-violet chipfill" x="545" y="120" width="215" height="170" rx="8" stroke-width="1.5"/>
  <circle class="d-violet led2" cx="744" cy="136" r="4"/>
  <text class="chiptitle violet" x="652" y="152" text-anchor="middle">LLM CORE</text>
  <text class="sub muted" x="652" y="174" text-anchor="middle">tool calling · memory</text>
  <rect class="s-violet" x="561" y="190" width="90" height="32" rx="6" stroke-width="1" stroke-opacity="0.5"/>
  <text class="tiny fg" x="606" y="210" text-anchor="middle">LangGraph</text>
  <rect class="s-violet" x="659" y="190" width="90" height="32" rx="6" stroke-width="1" stroke-opacity="0.5"/>
  <text class="tiny fg" x="704" y="210" text-anchor="middle">MCP</text>
  <rect class="s-violet" x="561" y="230" width="90" height="32" rx="6" stroke-width="1" stroke-opacity="0.5"/>
  <text class="tiny fg" x="606" y="250" text-anchor="middle">RAG</text>
  <rect class="s-violet" x="659" y="230" width="90" height="32" rx="6" stroke-width="1" stroke-opacity="0.5"/>
  <text class="tiny fg" x="704" y="250" text-anchor="middle">LoRA/QLoRA</text>

  <!-- infra bus modules -->
  <rect class="s-cyan chipfill" x="52" y="330" width="110" height="40" rx="6" stroke-width="1.2"/>
  <text class="fg" x="107" y="348" text-anchor="middle">FastAPI</text>
  <text class="tiny muted" x="107" y="363" text-anchor="middle">WebSockets</text>
  <rect class="s-cyan chipfill" x="174" y="330" width="116" height="40" rx="6" stroke-width="1.2"/>
  <text class="fg" x="232" y="348" text-anchor="middle">MongoDB</text>
  <text class="tiny muted" x="232" y="363" text-anchor="middle">Redis · Postgres</text>
  <rect class="s-cyan chipfill" x="302" y="330" width="110" height="40" rx="6" stroke-width="1.2"/>
  <text class="fg" x="357" y="348" text-anchor="middle">Docker</text>
  <text class="tiny muted" x="357" y="363" text-anchor="middle">Kubernetes</text>
  <rect class="s-cyan chipfill" x="424" y="330" width="110" height="40" rx="6" stroke-width="1.2"/>
  <text class="fg" x="479" y="348" text-anchor="middle">AWS · GCP</text>
  <text class="tiny muted" x="479" y="363" text-anchor="middle">Vertex AI</text>
  <rect class="s-cyan chipfill" x="546" y="330" width="110" height="40" rx="6" stroke-width="1.2"/>
  <text class="fg" x="601" y="348" text-anchor="middle">Langfuse</text>
  <text class="tiny muted" x="601" y="363" text-anchor="middle">evals · tracing</text>
  <rect class="s-cyan chipfill" x="668" y="330" width="122" height="40" rx="6" stroke-width="1.2"/>
  <text class="fg" x="729" y="348" text-anchor="middle">Vector DBs</text>
  <text class="tiny muted" x="729" y="363" text-anchor="middle">Pinecone · FAISS</text>

  <!-- caption -->
  <text class="muted" x="400" y="410" text-anchor="middle">voice in → outcome out · one runtime, every channel</text>
</svg>
