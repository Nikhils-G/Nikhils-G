<svg xmlns="http://www.w3.org/2000/svg" width="800" height="228" viewBox="0 0 800 228" role="img" aria-label="Stack — Voice: LiveKit, SIP and WebRTC, STT and TTS, Gemini Live. Agents: LangGraph, LangChain, MCP, RAG, LoRA and QLoRA. Backend: Python, FastAPI, WebSockets, MongoDB, Redis, PostgreSQL. Infra: Docker, Kubernetes, AWS, GCP Vertex, Langfuse. Data: PyTorch, Pinecone, FAISS, ChromaDB">
  <style>
    .amber  { fill: #b45309; }
    .violet { fill: #7c3aed; }
    .cyan   { fill: #0e7490; }
    .fg     { fill: #241f2e; }
    .p-amber  { fill: none; stroke: #b45309; stroke-opacity: 0.55; }
    .p-violet { fill: none; stroke: #7c3aed; stroke-opacity: 0.55; }
    .p-cyan   { fill: none; stroke: #0e7490; stroke-opacity: 0.55; }
    @media (prefers-color-scheme: dark) {
      .amber  { fill: #f0a63a; }
      .violet { fill: #a78bfa; }
      .cyan   { fill: #67e8f9; }
      .fg     { fill: #ece7f4; }
      .p-amber  { stroke: #f0a63a; }
      .p-violet { stroke: #a78bfa; }
      .p-cyan   { stroke: #67e8f9; }
    }
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
    }
    .cat { font-size: 13px; font-weight: 700; }
  </style>

  <!-- voice -->
  <text class="cat amber" x="118" y="35" text-anchor="end">voice</text>
  <rect class="p-amber" x="134" y="16" width="87" height="28" rx="14"/><text class="fg" x="177" y="35" text-anchor="middle">LiveKit</text>
  <rect class="p-amber" x="231" y="16" width="129" height="28" rx="14"/><text class="fg" x="295" y="35" text-anchor="middle">SIP · WebRTC</text>
  <rect class="p-amber" x="370" y="16" width="104" height="28" rx="14"/><text class="fg" x="422" y="35" text-anchor="middle">STT ⇄ TTS</text>
  <rect class="p-amber" x="484" y="16" width="120" height="28" rx="14"/><text class="fg" x="544" y="35" text-anchor="middle">Gemini Live</text>

  <!-- agents -->
  <text class="cat violet" x="118" y="77" text-anchor="end">agents</text>
  <rect class="p-violet" x="134" y="58" width="104" height="28" rx="14"/><text class="fg" x="186" y="77" text-anchor="middle">LangGraph</text>
  <rect class="p-violet" x="248" y="58" width="104" height="28" rx="14"/><text class="fg" x="300" y="77" text-anchor="middle">LangChain</text>
  <rect class="p-violet" x="362" y="58" width="53" height="28" rx="14"/><text class="fg" x="388" y="77" text-anchor="middle">MCP</text>
  <rect class="p-violet" x="425" y="58" width="53" height="28" rx="14"/><text class="fg" x="451" y="77" text-anchor="middle">RAG</text>
  <rect class="p-violet" x="488" y="58" width="129" height="28" rx="14"/><text class="fg" x="552" y="77" text-anchor="middle">LoRA · QLoRA</text>

  <!-- backend -->
  <text class="cat cyan" x="118" y="119" text-anchor="end">backend</text>
  <rect class="p-cyan" x="134" y="100" width="78" height="28" rx="14"/><text class="fg" x="173" y="119" text-anchor="middle">Python</text>
  <rect class="p-cyan" x="222" y="100" width="87" height="28" rx="14"/><text class="fg" x="265" y="119" text-anchor="middle">FastAPI</text>
  <rect class="p-cyan" x="319" y="100" width="112" height="28" rx="14"/><text class="fg" x="375" y="119" text-anchor="middle">WebSockets</text>
  <rect class="p-cyan" x="441" y="100" width="87" height="28" rx="14"/><text class="fg" x="484" y="119" text-anchor="middle">MongoDB</text>
  <rect class="p-cyan" x="538" y="100" width="70" height="28" rx="14"/><text class="fg" x="573" y="119" text-anchor="middle">Redis</text>
  <rect class="p-cyan" x="618" y="100" width="112" height="28" rx="14"/><text class="fg" x="674" y="119" text-anchor="middle">PostgreSQL</text>

  <!-- infra -->
  <text class="cat amber" x="118" y="161" text-anchor="end">infra</text>
  <rect class="p-amber" x="134" y="142" width="78" height="28" rx="14"/><text class="fg" x="173" y="161" text-anchor="middle">Docker</text>
  <rect class="p-amber" x="222" y="142" width="112" height="28" rx="14"/><text class="fg" x="278" y="161" text-anchor="middle">Kubernetes</text>
  <rect class="p-amber" x="344" y="142" width="53" height="28" rx="14"/><text class="fg" x="370" y="161" text-anchor="middle">AWS</text>
  <rect class="p-amber" x="407" y="142" width="129" height="28" rx="14"/><text class="fg" x="471" y="161" text-anchor="middle">GCP · Vertex</text>
  <rect class="p-amber" x="546" y="142" width="95" height="28" rx="14"/><text class="fg" x="593" y="161" text-anchor="middle">Langfuse</text>

  <!-- data -->
  <text class="cat violet" x="118" y="203" text-anchor="end">data</text>
  <rect class="p-violet" x="134" y="184" width="87" height="28" rx="14"/><text class="fg" x="177" y="203" text-anchor="middle">PyTorch</text>
  <rect class="p-violet" x="231" y="184" width="95" height="28" rx="14"/><text class="fg" x="278" y="203" text-anchor="middle">Pinecone</text>
  <rect class="p-violet" x="336" y="184" width="70" height="28" rx="14"/><text class="fg" x="371" y="203" text-anchor="middle">FAISS</text>
  <rect class="p-violet" x="416" y="184" width="95" height="28" rx="14"/><text class="fg" x="463" y="203" text-anchor="middle">ChromaDB</text>
</svg>
