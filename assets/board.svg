<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-label="Nikhil Sukthe — AI engineer across the stack, data to models to agents to outcomes. Founding AI Engineer at Fika.ai, Hyderabad. Drawn as a system board of six chips with signal running through them. Data Scientist: 200K-pair DailyDialog set, truncation negatives, ASR normalization, custom BPE tokenizer, large-scale EDA. Deep Learning: TurnWave, a 7M-parameter transformer from scratch in PyTorch with RoPE, RMSNorm and SwiGLU, F1 0.798 versus 0.753 baseline. ML Engineer: Qwen2.5-7B fine-tuned with QLoRA and TRL, 4-bit, 89 percent accuracy, served on vLLM. GenAI and Agents: multi-agent systems, MCP, RAG with semantic routing and hybrid search, LangGraph, multi-key LLM gateway. Voice AI: LiveKit, SIP, WebRTC, STT-LLM-TTS, Silero VAD, turn detection, Gemini Live, a 300 to 800 millisecond WhatsApp voice bridge. Outcomes: collection rate up 50 percent, WhatsApp catalog to payment, a sub-5-second RAG assistant with 15 percent uplift, all in production at Fika.ai. MLOps: Docker, Kubernetes, CI/CD, AWS, GCP Vertex, Langfuse, Grafana, Loki. Backend: FastAPI, WebSockets, MongoDB, Redis, Postgres, Pinecone, FAISS, ChromaDB. Open source: livekit/agents pull request 4798 in Python and charmbracelet/crush pull request 3644 in Go.">
  <defs>
    <linearGradient id="name-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="g-amber"/>
      <stop offset="1" class="g-violet"/>
    </linearGradient>
    <pattern id="pcb-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle class="grid-dot" cx="12" cy="12" r="1.1"/>
    </pattern>
    <clipPath id="clock-window"><rect x="706" y="11" width="52" height="16"/></clipPath>
  </defs>
  <style>
    .win      { fill: #fbf9f4; stroke: #e2dcd0; }
    .bar      { fill: #f1ecdf; }
    .chipfill { fill: #f1ecdf; }
    .dot1     { fill: #b45309; } .dot2 { fill: #7c3aed; } .dot3 { fill: #0e7490; }
    .fg       { fill: #241f2e; }
    .amber    { fill: #b45309; }
    .violet   { fill: #7c3aed; }
    .cyan     { fill: #0e7490; }
    .muted    { fill: #6f6880; }
    .track    { fill: #e2dcd0; }
    .grid-dot { fill: #6f6880; opacity: 0.15; }
    .s-amber  { fill: none; stroke: #b45309; }
    .s-violet { fill: none; stroke: #7c3aed; }
    .s-cyan   { fill: none; stroke: #0e7490; }
    .trace    { fill: none; stroke: #6f6880; stroke-width: 1.5; stroke-dasharray: 3 4; opacity: 0.55; }
    .spark    { fill: none; stroke: #7c3aed; stroke-width: 1.6; }
    .g-amber  { stop-color: #b45309; }
    .g-violet { stop-color: #7c3aed; }
    @media (prefers-color-scheme: dark) {
      .win      { fill: #0f0a1a; stroke: #2d2640; }
      .bar      { fill: #171126; }
      .chipfill { fill: #171126; }
      .dot1     { fill: #f0a63a; } .dot2 { fill: #a78bfa; } .dot3 { fill: #67e8f9; }
      .fg       { fill: #ece7f4; }
      .amber    { fill: #f0a63a; }
      .violet   { fill: #a78bfa; }
      .cyan     { fill: #67e8f9; }
      .muted    { fill: #8d86a0; }
      .track    { fill: #2d2640; }
      .grid-dot { fill: #8d86a0; opacity: 0.12; }
      .s-amber  { stroke: #f0a63a; }
      .s-violet { stroke: #a78bfa; }
      .s-cyan   { stroke: #67e8f9; }
      .trace    { stroke: #8d86a0; }
      .spark    { stroke: #a78bfa; }
      .g-amber  { stop-color: #f0a63a; }
      .g-violet { stop-color: #a78bfa; }
    }
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 11.5px;
    }
    .title { font-size: 12.5px; }
    .name  { font-size: 26px; font-weight: 700; fill: url(#name-grad); }
    .tag   { font-size: 12.5px; }
    .role  { font-size: 12.5px; font-weight: 700; letter-spacing: 1px; }
    .b     { font-weight: 700; }
    .digit { font-size: 13px; font-weight: 700; }

    .led  { animation: led 1.6s steps(1, end) infinite; }
    .led2 { animation: led 1.6s steps(1, end) 0.5s infinite; }
    .led3 { animation: led 1.6s steps(1, end) 1.0s infinite; }
    @keyframes led { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0.2; } }

    .spark { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 6s ease-out 1s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .roll { transform: translateY(0); }
    .s1  { animation: roll10 10s  steps(10, end) infinite; }
    .s10 { animation: roll6  60s  steps(6, end)  infinite; }
    .m1  { animation: roll10 600s steps(10, end) infinite; }
    @keyframes roll10 { to { transform: translateY(-200px); } }
    @keyframes roll6  { to { transform: translateY(-120px); } }
    .colon { animation: blink 1s steps(1, end) infinite; }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.25; } }

    @media (prefers-reduced-motion: reduce) {
      .led, .led2, .led3, .roll, .colon { animation: none; }
      .spark { animation: none; stroke-dashoffset: 0; }
      .pulse { display: none; }
    }
  </style>

  <!-- window -->
  <rect class="win" x="1" y="1" width="798" height="538" rx="10" stroke-width="1"/>
  <rect fill="url(#pcb-dots)" x="8" y="112" width="784" height="410"/>
