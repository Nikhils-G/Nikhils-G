  <path class="trace" d="M260 182 H284"/>
  <path class="trace" d="M516 182 H540"/>
  <path class="trace" d="M656 242 V274"/>
  <path class="trace" d="M540 334 H516"/>
  <path class="trace" d="M284 334 H260"/>
  <g class="pulse">
    <circle class="amber"  r="3"><animateMotion dur="1.2s" begin="0s"   repeatCount="indefinite" path="M260 182 H284"/></circle>
    <circle class="amber"  r="3"><animateMotion dur="1.2s" begin="0.6s" repeatCount="indefinite" path="M516 182 H540"/></circle>
    <circle class="violet" r="3"><animateMotion dur="1.4s" begin="0.3s" repeatCount="indefinite" path="M656 242 V274"/></circle>
    <circle class="violet" r="3"><animateMotion dur="1.2s" begin="0.9s" repeatCount="indefinite" path="M540 334 H516"/></circle>
    <circle class="violet" r="3"><animateMotion dur="1.2s" begin="0.2s" repeatCount="indefinite" path="M284 334 H260"/></circle>
  </g>

