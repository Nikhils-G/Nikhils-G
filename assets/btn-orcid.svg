<svg xmlns="http://www.w3.org/2000/svg" width="150" height="44" viewBox="0 0 150 44" role="img" aria-label="ORCID">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" class="ga"/><stop offset="1" class="gv"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" class="sh" stop-opacity="0"/><stop offset="0.5" class="sh" stop-opacity="1"/><stop offset="1" class="sh" stop-opacity="0"/></linearGradient>
    <clipPath id="pill"><rect x="1" y="1" width="148" height="42" rx="21"/></clipPath>
  </defs>
  <style>
    .fill  { fill: #fbf9f4; }
    .ga    { stop-color: #b45309; } .gv { stop-color: #7c3aed; }
    .label { fill: #241f2e; font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 600; letter-spacing: 0.2px; }
    .glyph { fill: #ffffff; font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 700; }
    .icon  { fill: #7c3aed; }
    .line  { fill: none; stroke: #7c3aed; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .sh    { stop-color: #7c3aed; }
    .sheen { opacity: 0.14; animation: sweep 7s ease-in-out 4.5s infinite; }
    @media (prefers-color-scheme: dark) {
      .fill  { fill: #171126; }
      .ga    { stop-color: #f0a63a; } .gv { stop-color: #a78bfa; }
      .label { fill: #ece7f4; }
      .glyph { fill: #171126; }
      .icon  { fill: #a78bfa; }
      .line  { stroke: #a78bfa; }
      .sh    { stop-color: #ffffff; }
      .sheen { opacity: 0.12; }
    }
    @keyframes sweep { 0% { transform: translateX(-170px) skewX(-20deg); } 40% { transform: translateX(170px) skewX(-20deg); } 100% { transform: translateX(170px) skewX(-20deg); } }
    @media (prefers-reduced-motion: reduce) { .sheen { display: none; } }
  </style>
  <rect class="fill" x="1" y="1" width="148" height="42" rx="21"/>
  <g clip-path="url(#pill)"><rect class="sheen" x="40" y="-10" width="70" height="64" fill="url(#sheen)"/></g>
  <rect x="1" y="1" width="148" height="42" rx="21" fill="none" stroke="url(#edge)" stroke-width="1.25"/>
  <circle class="icon" cx="48.5" cy="22" r="8"/>
  <text class="glyph" x="48.5" y="25.2" text-anchor="middle" font-size="9">iD</text>
  <text class="label" x="65.5" y="26.6">ORCID</text>
</svg>
