<svg xmlns="http://www.w3.org/2000/svg" width="800" height="210" viewBox="0 0 800 210" role="img" aria-label="Terminal: nikhil@ai-agents whoami — Nikhil Sukthe, AI Engineer, building agents that automate business across voice, WhatsApp, chat and email">
  <defs>
    <linearGradient id="name-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="g-amber"/>
      <stop offset="1" class="g-violet"/>
    </linearGradient>
  </defs>
  <style>
    .win     { fill: #fbf9f4; stroke: #e2dcd0; }
    .bar     { fill: #f1ecdf; }
    .dot1    { fill: #b45309; } .dot2 { fill: #7c3aed; } .dot3 { fill: #0e7490; }
    .fg      { fill: #241f2e; }
    .amber   { fill: #b45309; }
    .violet  { fill: #7c3aed; }
    .muted   { fill: #6f6880; }
    .cursorb { fill: #b45309; }
    .g-amber  { stop-color: #b45309; }
    .g-violet { stop-color: #7c3aed; }
    @media (prefers-color-scheme: dark) {
      .win     { fill: #0f0a1a; stroke: #2d2640; }
      .bar     { fill: #171126; }
      .dot1    { fill: #f0a63a; } .dot2 { fill: #a78bfa; } .dot3 { fill: #67e8f9; }
      .fg      { fill: #ece7f4; }
      .amber   { fill: #f0a63a; }
      .violet  { fill: #a78bfa; }
      .muted   { fill: #8d86a0; }
      .cursorb { fill: #f0a63a; }
      .g-amber  { stop-color: #f0a63a; }
      .g-violet { stop-color: #a78bfa; }
    }
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 15px;
    }
    .title { font-size: 12.5px; }
    .name  { font-size: 28px; font-weight: 700; fill: url(#name-grad); }
    .line  { opacity: 0; animation: appear 0.15s ease-out forwards; }
    .cmd   { clip-path: inset(0 100% 0 0); animation: typing 0.7s steps(6, end) 0.7s forwards; }
    .l1 { animation-delay: 0.3s; }
    .l2 { animation-delay: 1.7s; }
    .l3 { animation-delay: 2.3s; }
    .l4 { animation-delay: 3.0s; }
    @keyframes appear { to { opacity: 1; } }
    @keyframes typing { to { clip-path: inset(0 0 0 0); } }
    .cursor { opacity: 0; animation: blink 1.1s steps(1, end) 3.0s infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line, .cursor { animation: none; opacity: 1; }
      .cmd { animation: none; clip-path: none; }
    }
  </style>

  <!-- window -->
  <rect class="win" x="1" y="1" width="798" height="208" rx="10" stroke-width="1"/>
  <!-- title bar -->
  <path class="bar" d="M1 11 a10 10 0 0 1 10 -10 h778 a10 10 0 0 1 10 10 v25 h-798 z"/>
  <circle class="dot1" cx="24" cy="19" r="6"/>
  <circle class="dot2" cx="46" cy="19" r="6"/>
  <circle class="dot3" cx="68" cy="19" r="6"/>
  <text class="muted title" x="400" y="23" text-anchor="middle">nikhil@ai-agents: ~</text>

  <!-- session -->
  <text class="line l1" x="28" y="72"><tspan class="amber">nikhil@ai-agents</tspan><tspan class="muted">:~$</tspan></text>
  <text class="cmd fg" x="208" y="72">whoami</text>
  <text class="line l2 name" x="28" y="114">Nikhil Sukthe</text>
  <text class="line l3" x="28" y="147"><tspan class="violet">AI Engineer</tspan><tspan class="muted" dx="8">—</tspan><tspan class="fg" dx="8">agents that automate business</tspan><tspan class="muted" dx="10">voice · WhatsApp · chat · email</tspan></text>
  <text class="line l4" x="28" y="183"><tspan class="amber">nikhil@ai-agents</tspan><tspan class="muted">:~$</tspan></text>
  <rect class="cursorb cursor" x="222" y="171" width="9" height="16"/>
</svg>
