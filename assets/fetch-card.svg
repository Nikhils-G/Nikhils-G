    <rect fill="url(#wave-grad)" x="150" y="124" width="7" height="96" rx="3.5" style="animation-delay: 1.20s"/>
    <rect fill="url(#wave-grad)" x="163" y="146" width="7" height="52" rx="3.5" style="animation-delay: 1.35s"/>
    <rect fill="url(#wave-grad)" x="176" y="133" width="7" height="78" rx="3.5" style="animation-delay: 1.50s"/>
